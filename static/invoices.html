<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票台账｜供应链台账助手</title>
  <link rel="stylesheet" href="/static/ui.css">
</head>

<body data-page="invoices">
  <main class="page">
    <header class="header">
      <div>
        <h1>发票台账</h1>
        <p class="subtitle">集中查看销售与采购发票，并维护收付款、账期和复核状态。</p>
      </div>

      <div class="header-actions">
        <a class="button-link" href="/static/entry.html">智能录入发票</a>
        <button id="logout-button" type="button">退出登录</button>
        <button id="refresh-button" type="button">刷新台账</button>
      </div>
    </header>

    <section class="filters" aria-label="发票筛选">
      <div class="filter-item">
        <label for="type-filter">单据类型</label>
        <select id="type-filter">
          <option value="">全部类型</option>
          <option value="销售发票">销售发票</option>
          <option value="采购发票">采购发票</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="status-filter">收付款状态</label>
        <select id="status-filter">
          <option value="">全部状态</option>
          <option value="未收款">未收款</option>
          <option value="部分收款">部分收款</option>
          <option value="已收款">已收款</option>
          <option value="未付款">未付款</option>
          <option value="部分付款">部分付款</option>
          <option value="已付款">已付款</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="keyword-filter">关键词</label>
        <input id="keyword-filter" class="search-input" placeholder="发票号、客户/供应商、订单号">
      </div>
    </section>

    <section class="kpis" aria-label="发票台账概览">
      <article class="kpi-card">
        <div class="kpi-label">发票数量</div>
        <div class="kpi-value" id="kpi-count">0</div>
        <div class="kpi-hint">当前筛选结果</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">待收款金额</div>
        <div class="kpi-value" id="kpi-receivable">¥0.00</div>
        <div class="kpi-hint">销售发票未结清余额</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">待付款金额</div>
        <div class="kpi-value" id="kpi-payable">¥0.00</div>
        <div class="kpi-hint">采购发票未结清余额</div>
      </article>
      <article class="kpi-card">
        <div class="kpi-label">已逾期单据</div>
        <div class="kpi-value" id="kpi-overdue">0</div>
        <div class="kpi-hint">已过到期日且未结清</div>
      </article>
    </section>

    <section class="table-card">
      <div class="table-title">
        <h2>发票明细</h2>
        <span id="status-message" class="status-message">正在加载…</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>发票号</th>
              <th>类型</th>
              <th>购方 / 销方</th>
              <th>价税合计</th>
              <th>累计收付 / 剩余</th>
              <th>到期日</th>
              <th>收付款状态</th>
              <th>复核状态</th>
              <th>关联订单</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="invoice-table-body"></tbody>
        </table>
      </div>

      <div id="empty-message" class="empty" hidden>暂无符合条件的发票记录。</div>
    </section>

    <aside id="invoice-inspector" class="record-inspector" aria-labelledby="invoice-inspector-title" hidden>
      <header class="inspector-header">
        <div class="inspector-heading">
          <div id="invoice-inspector-type" class="inspector-kicker">发票详情</div>
          <h2 id="invoice-inspector-title">发票详情</h2>
        </div>
        <button id="invoice-inspector-close" class="inspector-close" type="button">关闭</button>
      </header>
      <div id="invoice-inspector-content" class="inspector-content"></div>
      <footer class="inspector-footer">
        <div class="inspector-footer-actions">
          <button id="invoice-inspector-delete" class="inspector-delete" type="button">删除</button>
          <div class="inspector-primary-actions">
            <a id="invoice-inspector-edit" class="button-link inspector-edit" href="#">编辑信息</a>
            <button id="invoice-inspector-confirm" type="button">确认无误</button>
          </div>
        </div>
        <p id="invoice-inspector-feedback" class="inspector-feedback" role="status" aria-live="polite"></p>
      </footer>
    </aside>
  </main>

  <dialog id="invoice-delete-dialog" class="delete-dialog" aria-labelledby="invoice-delete-title">
    <div class="delete-dialog-body">
      <h2 id="invoice-delete-title">删除这张发票？</h2>
      <p>
        发票 <strong id="invoice-delete-record"></strong> 将从本系统中删除，同时清除订单关联和提醒发送记录。
      </p>
      <p class="delete-dialog-warning">此操作不可恢复，已经发送到钉钉的消息不会撤回。</p>
      <p id="invoice-delete-feedback" class="delete-dialog-feedback" role="status" aria-live="polite"></p>
      <div class="delete-dialog-actions">
        <button id="invoice-delete-cancel" class="delete-cancel" type="button">取消</button>
        <button id="invoice-delete-confirm" class="delete-confirm" type="button">确认删除</button>
      </div>
    </div>
  </dialog>

  <script src="/static/ui.js"></script>
  <script>
    const state = {
      invoices: [],
      filteredInvoices: [],
      selectedInvoiceId: null,
      pendingDeleteInvoiceId: null
    };
    const currencyFormatter = new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: "CNY",
      minimumFractionDigits: 2
    });

    function formatMoney(value) {
      return currencyFormatter.format(Number(value || 0));
    }

    function deleteIcon() {
      return `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"></path>
        </svg>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getOutstandingAmount(invoice) {
      return Math.max(
        0,
        Number(invoice.amount_incl_tax || 0) - Number(invoice.paid_amount || 0)
      );
    }

    function isSettled(invoice) {
      return getOutstandingAmount(invoice) <= 0.009;
    }

    function isOverdue(invoice) {
      if (!invoice.due_date || isSettled(invoice)) {
        return false;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(`${invoice.due_date}T00:00:00`) < today;
    }

    function getStatusClass(status) {
      if (["已收款", "已付款", "已确认"].includes(status)) return "tag-success";
      if (["部分收款", "部分付款", "待人工确认"].includes(status)) return "tag-warning";
      if (["未收款", "未付款", "需人工复核"].includes(status)) return "tag-danger";
      return "tag-neutral";
    }

    function applyFilters() {
      const documentType = document.getElementById("type-filter").value;
      const paymentStatus = document.getElementById("status-filter").value;
      const keyword = document.getElementById("keyword-filter").value.trim().toLowerCase();

      state.filteredInvoices = state.invoices.filter((invoice) => {
        if (documentType && invoice.document_type !== documentType) return false;
        if (paymentStatus && invoice.payment_status !== paymentStatus) return false;

        const searchableText = [
          invoice.invoice_number,
          invoice.buyer_name,
          invoice.seller_name,
          ...(invoice.order_numbers || [])
        ].join(" ").toLowerCase();

        return !keyword || searchableText.includes(keyword);
      });

      renderLedger();

      if (
        state.selectedInvoiceId !== null &&
        !state.filteredInvoices.some((invoice) => Number(invoice.id) === state.selectedInvoiceId)
      ) {
        closeInvoiceInspector();
      }
    }

    function renderKpis() {
      const invoices = state.filteredInvoices;
      const receivable = invoices
        .filter((item) => item.document_type === "销售发票")
        .reduce((sum, item) => sum + getOutstandingAmount(item), 0);
      const payable = invoices
        .filter((item) => item.document_type === "采购发票")
        .reduce((sum, item) => sum + getOutstandingAmount(item), 0);

      document.getElementById("kpi-count").textContent = invoices.length;
      document.getElementById("kpi-receivable").textContent = formatMoney(receivable);
      document.getElementById("kpi-payable").textContent = formatMoney(payable);
      document.getElementById("kpi-overdue").textContent = invoices.filter(isOverdue).length;
    }

    function renderTable() {
      const body = document.getElementById("invoice-table-body");
      const emptyMessage = document.getElementById("empty-message");

      if (!state.filteredInvoices.length) {
        body.innerHTML = "";
        emptyMessage.hidden = false;
        return;
      }

      emptyMessage.hidden = true;
      body.innerHTML = state.filteredInvoices.map((invoice) => {
        const outstanding = getOutstandingAmount(invoice);
        const orderNumbers = (invoice.order_numbers || []).map(escapeHtml).join("<br>");

        return `
          <tr
            class="record-row ${Number(invoice.id) === state.selectedInvoiceId ? "is-selected" : ""}"
            data-invoice-id="${Number(invoice.id)}"
            tabindex="0"
            aria-label="查看发票 ${escapeHtml(invoice.invoice_number)} 的详细信息"
          >
            <td>${escapeHtml(invoice.invoice_number)}</td>
            <td>${escapeHtml(invoice.document_type)}</td>
            <td><div>${escapeHtml(invoice.buyer_name || "-")}</div><div class="muted">${escapeHtml(invoice.seller_name || "-")}</div></td>
            <td class="amount">${formatMoney(invoice.amount_incl_tax)}</td>
            <td class="amount"><div>${formatMoney(invoice.paid_amount)}</div><div class="muted">剩余：${formatMoney(outstanding)}</div></td>
            <td>${escapeHtml(invoice.due_date || "待填写")}</td>
            <td><span class="tag ${getStatusClass(invoice.payment_status)}">${escapeHtml(invoice.payment_status)}</span></td>
            <td><span class="tag ${getStatusClass(invoice.review_status)}">${escapeHtml(invoice.review_status)}</span></td>
            <td>${orderNumbers || "-"}</td>
            <td>
              <div class="table-row-actions">
                <button
                  class="row-delete-button"
                  type="button"
                  data-delete-invoice-id="${Number(invoice.id)}"
                  aria-label="删除发票 ${escapeHtml(invoice.invoice_number || "未编号发票")}"
                  title="删除"
                >${deleteIcon()}</button>
                <a class="table-action" href="/static/edit.html?id=${Number(invoice.id)}">编辑</a>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function formatDateTime(value) {
      return value ? String(value).replace("T", " ").slice(0, 16) : "-";
    }

    function invoiceParty(invoice) {
      return invoice.document_type === "销售发票"
        ? invoice.buyer_name
        : invoice.seller_name;
    }

    function renderInvoiceInspector(invoice) {
      const outstanding = getOutstandingAmount(invoice);
      const paymentLabel = invoice.document_type === "销售发票" ? "累计收款" : "累计付款";
      const balanceLabel = invoice.document_type === "销售发票" ? "待收款" : "待付款";
      const orderNumbers = invoice.order_numbers || [];
      const notes = invoice.review_notes || [];

      document.getElementById("invoice-inspector-type").textContent = invoice.document_type || "发票详情";
      document.getElementById("invoice-inspector-title").textContent = invoice.invoice_number || "未编号发票";
      document.getElementById("invoice-inspector-edit").href = `/static/edit.html?id=${encodeURIComponent(invoice.id)}`;

      const confirmButton = document.getElementById("invoice-inspector-confirm");
      confirmButton.disabled = invoice.review_status === "已确认";
      confirmButton.textContent = invoice.review_status === "已确认" ? "已确认" : "确认无误";

      document.getElementById("invoice-inspector-content").innerHTML = `
        <section class="inspector-section">
          <h3>基本信息</h3>
          <dl class="inspector-definition-grid">
            <div><dt>往来单位</dt><dd>${escapeHtml(invoiceParty(invoice) || "-")}</dd></div>
            <div><dt>开票日期</dt><dd>${escapeHtml(invoice.invoice_date || "-")}</dd></div>
            <div><dt>购方</dt><dd>${escapeHtml(invoice.buyer_name || "-")}</dd></div>
            <div><dt>销方</dt><dd>${escapeHtml(invoice.seller_name || "-")}</dd></div>
            <div><dt>到期日</dt><dd>${escapeHtml(invoice.due_date || "待填写")}</dd></div>
            <div><dt>负责人</dt><dd>${escapeHtml(invoice.owner || "待分配")}</dd></div>
          </dl>
        </section>
        <section class="inspector-section">
          <h3>金额与收付款</h3>
          <div class="inspector-finance-grid">
            <div class="inspector-stat"><span>不含税金额</span><strong>${formatMoney(invoice.amount_excl_tax)}</strong></div>
            <div class="inspector-stat"><span>税额</span><strong>${formatMoney(invoice.tax_amount)}</strong></div>
            <div class="inspector-stat"><span>价税合计</span><strong>${formatMoney(invoice.amount_incl_tax)}</strong></div>
            <div class="inspector-stat"><span>预付款</span><strong>${formatMoney(invoice.prepayment_amount)}</strong></div>
            <div class="inspector-stat is-paid"><span>${paymentLabel}</span><strong>${formatMoney(invoice.paid_amount)}</strong></div>
            <div class="inspector-stat is-balance"><span>${balanceLabel}</span><strong>${formatMoney(outstanding)}</strong></div>
          </div>
          <div class="inspector-status-line">
            <span>收付款状态</span>
            <span class="tag ${getStatusClass(invoice.payment_status)}">${escapeHtml(invoice.payment_status)}</span>
          </div>
        </section>
        <section class="inspector-section">
          <h3>关联订单</h3>
          ${orderNumbers.length
            ? `<ul class="inspector-link-list">${orderNumbers.map((number) => `<li><strong>${escapeHtml(number)}</strong></li>`).join("")}</ul>`
            : '<div class="inspector-empty-copy">暂未关联订单。</div>'}
        </section>
        <section class="inspector-section">
          <h3>商品明细</h3>
          ${invoice.items_text
            ? `<pre class="inspector-raw-text">${escapeHtml(invoice.items_text)}</pre>`
            : '<div class="inspector-empty-copy">暂无商品明细。</div>'}
        </section>
        <section class="inspector-section">
          <h3>复核信息</h3>
          <div class="inspector-status-line">
            <span>复核状态</span>
            <span class="tag ${getStatusClass(invoice.review_status)}">${escapeHtml(invoice.review_status)}</span>
          </div>
          ${notes.length
            ? `<ul class="inspector-note-list">${notes.map((note) => `<li>${escapeHtml(note)}</li>`).join("")}</ul>`
            : '<div class="inspector-empty-copy">暂无复核备注。</div>'}
        </section>
        <section class="inspector-section">
          <h3>来源与记录</h3>
          <dl class="inspector-definition-grid">
            <div><dt>来源文件</dt><dd>${escapeHtml(invoice.source_filename || "-")}</dd></div>
            <div><dt>上传时间</dt><dd>${escapeHtml(formatDateTime(invoice.created_at))}</dd></div>
            <div><dt>最近更新</dt><dd>${escapeHtml(formatDateTime(invoice.updated_at))}</dd></div>
          </dl>
        </section>
      `;
    }

    function setInvoiceInspectorFeedback(message, type = "") {
      const feedback = document.getElementById("invoice-inspector-feedback");
      feedback.textContent = message;
      feedback.dataset.type = type;
    }

    function openInvoiceInspector(invoiceId, focusClose = true) {
      const invoice = state.invoices.find((item) => Number(item.id) === Number(invoiceId));
      if (!invoice) return;

      state.selectedInvoiceId = Number(invoice.id);
      renderInvoiceInspector(invoice);
      renderTable();
      setInvoiceInspectorFeedback("");

      const inspector = document.getElementById("invoice-inspector");
      inspector.hidden = false;
      document.body.classList.add("inspector-open");
      if (focusClose) document.getElementById("invoice-inspector-close").focus();
    }

    function closeInvoiceInspector() {
      const selectedId = state.selectedInvoiceId;
      state.selectedInvoiceId = null;
      document.getElementById("invoice-inspector").hidden = true;
      document.body.classList.remove("inspector-open");
      renderTable();

      if (selectedId !== null) {
        document.querySelector(`[data-invoice-id="${selectedId}"]`)?.focus();
      }
    }

    async function confirmInvoice() {
      if (state.selectedInvoiceId === null) return;

      const button = document.getElementById("invoice-inspector-confirm");
      button.disabled = true;
      setInvoiceInspectorFeedback("正在确认…");

      try {
        const response = await fetch(`/api/invoices/${state.selectedInvoiceId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ review_status: "已确认" })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(typeof result.detail === "string" ? result.detail : "确认失败。");
        }

        await loadInvoices();
        openInvoiceInspector(state.selectedInvoiceId, false);
        setInvoiceInspectorFeedback("已标记为确认无误。", "success");
      } catch (error) {
        button.disabled = false;
        setInvoiceInspectorFeedback(error.message, "error");
      }
    }

    function openInvoiceDeleteDialog(invoiceId = state.selectedInvoiceId) {
      const normalizedInvoiceId = Number(invoiceId);
      const invoice = state.invoices.find(
        (item) => Number(item.id) === normalizedInvoiceId
      );
      if (!invoice) return;

      state.pendingDeleteInvoiceId = normalizedInvoiceId;

      document.getElementById("invoice-delete-record").textContent =
        invoice.invoice_number || "未编号发票";
      document.getElementById("invoice-delete-feedback").textContent = "";

      const confirmButton = document.getElementById("invoice-delete-confirm");
      confirmButton.disabled = false;
      confirmButton.textContent = "确认删除";

      document.getElementById("invoice-delete-dialog").showModal();
      document.getElementById("invoice-delete-cancel").focus();
    }

    function closeInvoiceDeleteDialog() {
      const dialog = document.getElementById("invoice-delete-dialog");
      if (dialog.open) dialog.close();
      state.pendingDeleteInvoiceId = null;
    }

    async function deleteInvoice() {
      const deleteInvoiceId = state.pendingDeleteInvoiceId;
      if (deleteInvoiceId === null) return;

      const invoice = state.invoices.find(
        (item) => Number(item.id) === deleteInvoiceId
      );
      if (!invoice) return;

      const confirmButton = document.getElementById("invoice-delete-confirm");
      const feedback = document.getElementById("invoice-delete-feedback");
      confirmButton.disabled = true;
      confirmButton.textContent = "正在删除…";
      feedback.textContent = "正在删除发票及其关联记录…";

      try {
        const response = await fetch(`/api/invoices/${deleteInvoiceId}`, {
          method: "DELETE"
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(
            typeof result.detail === "string" ? result.detail : "删除发票失败。"
          );
        }

        const deletedNumber = invoice.invoice_number || "未编号发票";
        const inspectorShowsDeletedInvoice = state.selectedInvoiceId === deleteInvoiceId;
        closeInvoiceDeleteDialog();
        if (inspectorShowsDeletedInvoice) closeInvoiceInspector();
        await loadInvoices();
        document.getElementById("status-message").textContent =
          `发票 ${deletedNumber} 已删除。`;
      } catch (error) {
        feedback.textContent = error.message;
        confirmButton.disabled = false;
        confirmButton.textContent = "重新删除";
      }
    }

    function renderLedger() {
      renderKpis();
      renderTable();
      document.getElementById("status-message").textContent = `当前展示 ${state.filteredInvoices.length} 条记录`;
    }

    async function loadInvoices() {
      const statusMessage = document.getElementById("status-message");
      statusMessage.textContent = "正在加载…";

      try {
        const response = await fetch("/api/invoices");
        if (!response.ok) throw new Error(`台账请求失败：${response.status}`);

        const result = await response.json();
        state.invoices = result.items || [];
        applyFilters();
      } catch (error) {
        console.error(error);
        state.invoices = [];
        state.filteredInvoices = [];
        renderLedger();
        statusMessage.textContent = "加载失败，请确认后端服务正在运行。";
      }
    }

    document.getElementById("refresh-button").addEventListener("click", loadInvoices);
    document.getElementById("logout-button").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      window.location.href = "/login";
    });
    document.getElementById("type-filter").addEventListener("change", applyFilters);
    document.getElementById("status-filter").addEventListener("change", applyFilters);
    document.getElementById("keyword-filter").addEventListener("input", applyFilters);
    document.getElementById("invoice-table-body").addEventListener("click", (event) => {
      const deleteButton = event.target.closest("[data-delete-invoice-id]");
      if (deleteButton) {
        openInvoiceDeleteDialog(deleteButton.dataset.deleteInvoiceId);
        return;
      }
      if (event.target.closest("a, button")) return;
      const row = event.target.closest("[data-invoice-id]");
      if (row) openInvoiceInspector(row.dataset.invoiceId);
    });
    document.getElementById("invoice-table-body").addEventListener("keydown", (event) => {
      if (!["Enter", " "].includes(event.key) || event.target.closest("a, button")) return;
      const row = event.target.closest("[data-invoice-id]");
      if (!row) return;
      event.preventDefault();
      openInvoiceInspector(row.dataset.invoiceId);
    });
    document.getElementById("invoice-inspector-close").addEventListener("click", closeInvoiceInspector);
    document.getElementById("invoice-inspector-confirm").addEventListener("click", confirmInvoice);
    document.getElementById("invoice-inspector-delete").addEventListener("click", () => openInvoiceDeleteDialog());
    document.getElementById("invoice-delete-cancel").addEventListener("click", closeInvoiceDeleteDialog);
    document.getElementById("invoice-delete-confirm").addEventListener("click", deleteInvoice);
    document.addEventListener("keydown", (event) => {
      const deleteDialogOpen = document.getElementById("invoice-delete-dialog").open;
      if (event.key === "Escape" && state.selectedInvoiceId !== null && !deleteDialogOpen) {
        closeInvoiceInspector();
      }
    });
    loadInvoices();
  </script>
</body>
</html>
