<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票台账助手</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #e5e7eb;
      --success: #15803d;
      --warning: #b45309;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .button-link {
      padding: 10px 16px;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: #eff6ff;
      text-decoration: none;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    button, select, input {
      font: inherit;
    }

    button {
      padding: 10px 16px;
      color: white;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .filters, .table-card, .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      padding: 16px;
      margin-bottom: 16px;
    }

    .filter-item {
      display: grid;
      gap: 6px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    select, input {
      min-width: 160px;
      padding: 9px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: white;
    }

    .search-input { min-width: 260px; }

    .kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .kpi-card { padding: 18px; }

    .kpi-label {
      color: var(--muted);
      font-size: 13px;
    }

    .kpi-value {
      margin-top: 8px;
      font-size: 26px;
      font-weight: 700;
    }

    .kpi-hint {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .table-card {
      overflow: hidden;
    }

    .table-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      border-bottom: 1px solid var(--border);
    }

    .table-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .status-message {
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      min-width: 1080px;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 13px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      background: #f8fafc;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr:hover { background: #f8fbff; }

    .amount {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .muted { color: var(--muted); }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag-success { color: var(--success); background: #dcfce7; }
    .tag-warning { color: var(--warning); background: #fef3c7; }
    .tag-danger { color: var(--danger); background: #fee2e2; }
    .tag-neutral { color: #475569; background: #e2e8f0; }

    .empty {
      padding: 42px;
      color: var(--muted);
      text-align: center;
    }

    .reminder-card {
      margin-bottom: 16px;
      padding: 18px;
      border: 1px solid #fed7aa;
      border-radius: 12px;
      background: #fffaf5;
    }

    .reminder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .reminder-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .reminder-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .reminder-header select {
      min-width: 100px;
    }

    .reminder-list {
      display: grid;
      gap: 10px;
    }

    .reminder-item {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid #fde68a;
      border-radius: 8px;
      background: white;
      font-size: 13px;
    }

    .reminder-item strong {
      display: block;
      margin-bottom: 3px;
    }

    .reminder-amount {
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .reminder-item {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media (max-width: 900px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 620px) {
      .header { align-items: flex-start; flex-direction: column; }
      .kpis { grid-template-columns: 1fr; }
      .search-input { min-width: 100%; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>发票台账助手</h1>
        <p class="subtitle">发票识别、人工复核、账期管理与收付款跟踪</p>
      </div>
      <div class="header-actions">
        <a class="button-link" href="/static/entry.html">智能录入发票</a>
        <button id="refresh-button">刷新台账</button>
      </div>
    </header>

    <section class="filters">
      <div class="filter-item">
        <label for="type-filter">单据类型</label>
        <select id="type-filter">
          <option value="">全部类型</option>
          <option value="销售发票">销售发票</option>
          <option value="采购发票">采购发票</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="status-filter">收付款状态</label>
        <select id="status-filter">
          <option value="">全部状态</option>
          <option value="未收款">未收款</option>
          <option value="部分收款">部分收款</option>
          <option value="已收款">已收款</option>
          <option value="未付款">未付款</option>
          <option value="部分付款">部分付款</option>
          <option value="已付款">已付款</option>
        </select>
      </div>

      <div class="filter-item">
        <label for="keyword-filter">关键词</label>
        <input
          id="keyword-filter"
          class="search-input"
          placeholder="发票号、客户/供应商、订单号"
        >
      </div>
    </section>

    <section class="kpis">
      <article class="kpi-card">
        <div class="kpi-label">台账数量</div>
        <div class="kpi-value" id="kpi-count">0</div>
        <div class="kpi-hint">当前筛选结果</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-label">待收款金额</div>
        <div class="kpi-value" id="kpi-receivable">¥0.00</div>
        <div class="kpi-hint">销售发票未结清余额</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-label">待付款金额</div>
        <div class="kpi-value" id="kpi-payable">¥0.00</div>
        <div class="kpi-hint">采购发票未结清余额</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-label">已逾期单据</div>
        <div class="kpi-value" id="kpi-overdue">0</div>
        <div class="kpi-hint">已过到期日且未结清</div>
      </article>
    </section>

    <section class="reminder-card">
      <div class="reminder-header">
        <div>
          <h2>账期预警</h2>
          <p>仅展示未结清的已逾期、今日到期和即将到期单据。</p>
        </div>

        <label>
          预警范围
          <select id="reminder-days">
            <option value="7">未来 7 天</option>
            <option value="15">未来 15 天</option>
            <option value="30">未来 30 天</option>
          </select>
        </label>
      </div>

      <div id="reminder-list" class="reminder-list"></div>
    </section>

    <section class="table-card">
      <div class="table-title">
        <h2>发票台账明细</h2>
        <span id="status-message" class="status-message">正在加载…</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>发票号</th>
              <th>类型</th>
              <th>购方 / 销方</th>
              <th>价税合计</th>
              <th>累计收付 / 剩余</th>
              <th>到期日</th>
              <th>收付款状态</th>
              <th>复核状态</th>
              <th>关联订单</th>
            </tr>
          </thead>
          <tbody id="invoice-table-body"></tbody>
        </table>
      </div>

      <div id="empty-message" class="empty" hidden>暂无符合条件的台账记录。</div>
    </section>
  </main>

  <script>
    const state = {
      invoices: [],
      filteredInvoices: [],
      reminders: []
    };

    const currencyFormatter = new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: "CNY",
      minimumFractionDigits: 2
    });

    function formatMoney(value) {
      return currencyFormatter.format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getOutstandingAmount(invoice) {
      return Math.max(
        0,
        Number(invoice.amount_incl_tax || 0) - Number(invoice.paid_amount || 0)
      );
    }

    function isSettled(invoice) {
      return getOutstandingAmount(invoice) <= 0.009;
    }

    function getStatusClass(status) {
      if (["已收款", "已付款", "已确认"].includes(status)) {
        return "tag-success";
      }

      if (["部分收款", "部分付款", "待人工确认"].includes(status)) {
        return "tag-warning";
      }

      if (["未收款", "未付款", "需人工复核"].includes(status)) {
        return "tag-danger";
      }

      return "tag-neutral";
    }

    function isOverdue(invoice) {
      if (!invoice.due_date || isSettled(invoice)) {
        return false;
      }

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const dueDate = new Date(`${invoice.due_date}T00:00:00`);
      return dueDate < today;
    }

    function applyFilters() {
      const documentType = document.getElementById("type-filter").value;
      const paymentStatus = document.getElementById("status-filter").value;
      const keyword = document.getElementById("keyword-filter").value
        .trim()
        .toLowerCase();

      state.filteredInvoices = state.invoices.filter((invoice) => {
        if (documentType && invoice.document_type !== documentType) {
          return false;
        }

        if (paymentStatus && invoice.payment_status !== paymentStatus) {
          return false;
        }

        const searchableText = [
          invoice.invoice_number,
          invoice.buyer_name,
          invoice.seller_name,
          ...(invoice.order_numbers || [])
        ].join(" ").toLowerCase();

        return !keyword || searchableText.includes(keyword);
      });

      renderDashboard();
    }

    function renderKpis() {
      const invoices = state.filteredInvoices;

      const receivable = invoices
        .filter((item) => item.document_type === "销售发票")
        .reduce((sum, item) => sum + getOutstandingAmount(item), 0);

      const payable = invoices
        .filter((item) => item.document_type === "采购发票")
        .reduce((sum, item) => sum + getOutstandingAmount(item), 0);

      const overdueCount = invoices.filter(isOverdue).length;

      document.getElementById("kpi-count").textContent = invoices.length;
      document.getElementById("kpi-receivable").textContent = formatMoney(receivable);
      document.getElementById("kpi-payable").textContent = formatMoney(payable);
      document.getElementById("kpi-overdue").textContent = overdueCount;
    }

    function renderTable() {
      const body = document.getElementById("invoice-table-body");
      const emptyMessage = document.getElementById("empty-message");

      if (state.filteredInvoices.length === 0) {
        body.innerHTML = "";
        emptyMessage.hidden = false;
        return;
      }

      emptyMessage.hidden = true;

      body.innerHTML = state.filteredInvoices.map((invoice) => {
        const outstanding = getOutstandingAmount(invoice);
        const orderNumbers = (invoice.order_numbers || []).join("<br>");

        return `
          <tr>
            <td>${escapeHtml(invoice.invoice_number)}</td>
            <td>${escapeHtml(invoice.document_type)}</td>
            <td>
              <div>${escapeHtml(invoice.buyer_name || "-")}</div>
              <div class="muted">${escapeHtml(invoice.seller_name || "-")}</div>
            </td>
            <td class="amount">${formatMoney(invoice.amount_incl_tax)}</td>
            <td class="amount">
              <div>${formatMoney(invoice.paid_amount)}</div>
              <div class="muted">剩余：${formatMoney(outstanding)}</div>
            </td>
            <td>${escapeHtml(invoice.due_date || "待填写")}</td>
            <td>
              <span class="tag ${getStatusClass(invoice.payment_status)}">
                ${escapeHtml(invoice.payment_status)}
              </span>
            </td>
            <td>
              <span class="tag ${getStatusClass(invoice.review_status)}">
                ${escapeHtml(invoice.review_status)}
              </span>
            </td>
            <td>${orderNumbers || "-"}</td>
          </tr>
        `;
      }).join("");
    }

    function getReminderClass(status) {
      if (status === "已逾期") {
        return "tag-danger";
      }

      if (status === "今日到期") {
        return "tag-warning";
      }

      return "tag-neutral";
    }

    function renderReminders() {
      const container = document.getElementById("reminder-list");

      if (state.reminders.length === 0) {
        container.innerHTML = `
          <div class="muted">
            当前预警范围内暂无需要跟进的未结清单据。
          </div>
        `;
        return;
      }

      container.innerHTML = state.reminders.map((item) => `
        <article class="reminder-item">
          <div>
            <span class="tag ${getReminderClass(item.reminder_status)}">
              ${escapeHtml(item.reminder_status)}
            </span>
          </div>

          <div>
            <strong>${escapeHtml(item.invoice_number)}</strong>
            <div>${escapeHtml(item.counterparty || "-")}</div>
            <div class="muted">
              到期日：${escapeHtml(item.due_date)}
              ｜剩余 ${item.days_to_due} 天
              ｜负责人：${escapeHtml(item.owner || "待分配")}
            </div>
          </div>

          <div class="reminder-amount">
            待收付：${formatMoney(item.amount_due)}
          </div>
        </article>
      `).join("");
    }

    function renderDashboard() {
      renderKpis();
      renderTable();

      document.getElementById("status-message").textContent =
        `当前展示 ${state.filteredInvoices.length} 条记录`;
    }

    async function loadInvoices() {
      const statusMessage = document.getElementById("status-message");
      const reminderDays = document.getElementById("reminder-days").value;

      statusMessage.textContent = "正在加载…";

      try {
        const [invoiceResponse, reminderResponse] = await Promise.all([
          fetch("/api/invoices"),
          fetch(`/api/reminders/due?days_before=${reminderDays}`)
        ]);

        if (!invoiceResponse.ok) {
          throw new Error(`台账请求失败：${invoiceResponse.status}`);
        }

        if (!reminderResponse.ok) {
          throw new Error(`提醒请求失败：${reminderResponse.status}`);
        }

        const invoiceResult = await invoiceResponse.json();
        const reminderResult = await reminderResponse.json();

        state.invoices = invoiceResult.items || [];
        state.reminders = reminderResult.items || [];

        applyFilters();
        renderReminders();
      } catch (error) {
        console.error(error);

        state.invoices = [];
        state.filteredInvoices = [];
        state.reminders = [];

        renderDashboard();
        renderReminders();

        statusMessage.textContent = "加载失败，请确认后端服务正在运行。";
      }
    }

    document.getElementById("refresh-button").addEventListener("click", loadInvoices);
    document.getElementById("type-filter").addEventListener("change", applyFilters);
    document.getElementById("status-filter").addEventListener("change", applyFilters);
    document.getElementById("keyword-filter").addEventListener("input", applyFilters);
    document.getElementById("reminder-days").addEventListener("change", loadInvoices);
    loadInvoices();
  </script>
</body>
</html>
